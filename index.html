<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Start Planning</title>

<style>
body {
  margin: 0;
  font-family: 'Segoe UI', sans-serif;
  background: #f5f7fb;
}

/* Top banner with your image */
.banner {
  height: 220px;
  background: url("https://cdn.elearningindustry.com/wp-content/uploads/2016/07/start-planning-elearning-courses.jpg") center/cover no-repeat;
  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
  font-size: 32px;
  font-weight: bold;
  text-shadow: 0 4px 10px rgba(0,0,0,0.4);
}

/* Card container */
.card {
  max-width: 500px;
  margin: -60px auto 0 auto;
  background: white;
  border-radius: 20px;
  padding: 30px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.1);
  text-align: center;
}

/* Title */
.card h2 {
  margin-bottom: 10px;
}

/* Description text */
.card p {
  color: #666;
  margin-bottom: 25px;
}

/* Buttons */
button {
  border: none;
  padding: 12px 20px;
  margin: 8px;
  border-radius: 12px;
  font-size: 15px;
  cursor: pointer;
  transition: 0.2s;
}

/* Primary button */
.primary {
  background: #007aff;
  color: white;
}

.primary:hover {
  background: #005ecb;
}

/* Secondary button */
.secondary {
  background: #e5e7eb;
}

.secondary:hover {
  background: #d1d5db;
}

/* Continue button hidden initially */
#continueBtn {
  display: none;
  margin-top: 15px;
  background: #22c55e;
  color: white;
}

#continueBtn:hover {
  background: #16a34a;
}

</style>
</head>

<body>

<div class="banner">
  Start Planning ✈️
</div>

<div class="card">
  <h2>Book Your Flight</h2>
  <p>Find and book your flight, then come back to continue planning your trip.</p>

  <button class="primary" onclick="startFlightSearch()">🔍 Find Flights</button>
  <button class="secondary" onclick="skipFlight()">⏭ Already Booked</button>

  <button id="continueBtn" onclick="continuePlanning()">
    ✅ Continue Planning
  </button>
</div>

<script>
function startFlightSearch() {
  window.open("https://www.skyscanner.net", "_blank");
}

// Show continue button when user comes back
document.addEventListener("visibilitychange", () => {
  if (!document.hidden) {
    document.getElementById("continueBtn").style.display = "inline-block";
  }
});

function skipFlight() {
  continuePlanning();
}

function continuePlanning() {
  alert("Next step: Accommodation 🏨");
}
</script>

</body>
</html>
