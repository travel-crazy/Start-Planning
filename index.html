<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Start Planning</title>

<style>
body{
    font-family: Arial, sans-serif;
    background:#f4f6f8;
    margin:0;
    text-align:center;
}

h1{
    margin-top:40px;
}

.planner-bar{
    display:flex;
    gap:10px;
    padding:15px;
    background:white;
    border-radius:12px;
    width:fit-content;
    margin:50px auto;
    box-shadow:0 4px 10px rgba(0,0,0,0.1);
}

.planner-bar input{
    padding:10px;
    border-radius:8px;
    border:1px solid #ccc;
    font-size:16px;
}

.search-btn{
    padding:10px 20px;
    border:none;
    border-radius:8px;
    background:#007bff;
    color:white;
    font-size:16px;
    cursor:pointer;
}

.search-btn:hover{
    background:#0056b3;
}

/* Result box */
#flightResult{
    display:none;
    margin-top:20px;
}

.result-card{
    background:white;
    display:inline-block;
    padding:20px;
    border-radius:12px;
    box-shadow:0 4px 10px rgba(0,0,0,0.1);
}

.result-card button{
    margin:10px;
    padding:10px 15px;
    border:none;
    border-radius:6px;
    cursor:pointer;
}

.buy{
    background:green;
    color:white;
}

.skip{
    background:gray;
    color:white;
}
</style>
</head>

<body>

<h1>Search Flights ✈️</h1>

<div class="planner-bar">
  <input type="text" id="from" placeholder="From where?">
  <input type="text" id="to" placeholder="To where?">
  <input type="date" id="date">
  <button class="search-btn" onclick="searchFlights()">Search</button>
</div>

<!-- RESULT -->
<div id="flightResult">
  <div class="result-card">
    <p id="flightInfo">Searching...</p>
    <button class="buy" onclick="buyFlight()">Buy</button>
    <button class="skip" onclick="skipFlight()">Skip</button>
  </div>
</div>

<script>
function searchFlights() {
  const from = document.getElementById("from").value.trim();
  const to = document.getElementById("to").value.trim();
  const date = document.getElementById("date").value;

  if (!from || !to || !date) {
    alert("Please fill all fields!");
    return;
  }

  const resultBox = document.getElementById("flightResult");
  const info = document.getElementById("flightInfo");

  resultBox.style.display = "block";
  info.innerText = "Searching for the best flights... ✈️";

  setTimeout(function() {
    const price = Math.floor(Math.random() * 200) + 50;
    info.innerText = "✈️ Flight from " + from + " → " + to + " on " + date + "\n💸 Price: £" + price + "\nOnly 3 seats left!";
  }, 2000);
}

function buyFlight() {
  const from = document.getElementById("from").value.trim();
  const to = document.getElementById("to").value.trim();

  const url = "https://www.google.com/search?q=flights+" + from + "+to+" + to;
  window.open(url, "_blank");
}

function skipFlight() {
  document.getElementById("flightResult").style.display = "none";
}
</script>

</body>
</html>
