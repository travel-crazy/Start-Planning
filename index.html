<h2>Step 1: Book Your Flight</h2>

<button onclick="startFlightSearch()">🔍 Find Flights</button>
<button onclick="skipFlight()">⏭ Skip (Already Booked)</button>

<p id="infoText">
  After booking your flight, come back here and click Continue.
</p>

<button id="continueBtn" style="display:none;" onclick="continuePlanning()">
  ✅ Continue Planning
</button>

<script>
function startFlightSearch() {
  window.open("https://www.skyscanner.net", "_blank");

  document.getElementById("infoText").innerText =
    "Book your flight in the new tab, then come back here!";
}

// Detect when user comes back to the tab
document.addEventListener("visibilitychange", () => {
  if (!document.hidden) {
    document.getElementById("continueBtn").style.display = "inline-block";
  }
});

function skipFlight() {
  continuePlanning();
}

function continuePlanning() {
  alert("Moving to next step: Accommodation 🏨");
  // You can redirect or show next section here
  // example:
  // window.location.href = "next-step.html";
}
</script>
