<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Start Planning</title>

<style>
body{
    font-family: Arial, sans-serif;
    background:#f4f6f8;
    margin:0;
    padding:0;
}

h1{
    text-align:center;
    margin-top:40px;
    color:#333;
}

.planner-bar{
    display:flex;
    gap:10px;
    padding:15px;
    background:white;
    border-radius:12px;
    width:fit-content;
    margin:50px auto;
    box-shadow:0 4px 10px rgba(0,0,0,0.1);
}

.planner-bar input{
    padding:10px;
    border-radius:8px;
    border:1px solid #ccc;
    font-size:16px;
}

.search-btn{
    padding:10px 20px;
    border:none;
    border-radius:8px;
    background:#007bff;
    color:white;
    font-size:16px;
    cursor:pointer;
}

.search-btn:hover{
    background:#0056b3;
}
</style>
</head>
<body>

<h1>Start Planning Your Trip</h1>

<div class="planner-bar">
    <input type="text" placeholder="From where?">
    <input type="text" placeholder="To where?">
    <input type="date" placeholder="Departure date">
    <input type="date" placeholder="Arrival date">
    <div class="trip-type-toggle">
  <input type="checkbox" id="trip-toggle">
  <label for="trip-toggle" class="toggle-label">
    <span class="left">One Way</span>
    <span class="right">Round Trip</span>
    <span class="slider"></span>
  </label>
</div>

<style>
.trip-type-toggle {
  display: inline-block;
  vertical-align: middle;
}

.toggle-label {
  position: relative;
  display: flex;
  align-items: center;
  width: 120px;
  height: 36px;
  background: #ccc;
  border-radius: 18px;
  cursor: pointer;
  user-select: none;
  font-family: Arial, sans-serif;
  font-size: 14px;
  font-weight: bold;
  padding: 0 5px;
  box-sizing: border-box;
}

.toggle-label span.left,
.toggle-label span.right {
  flex: 1;
  text-align: center;
  z-index: 2;
}

.toggle-label .slider {
  position: absolute;
  top: 2px;
  left: 2px;
  width: 56px;
  height: 32px;
  background: #007bff;
  border-radius: 16px;
  transition: 0.3s;
  z-index: 1;
}

#trip-toggle {
  display: none;
}

#trip-toggle:checked + .toggle-label .slider {
  transform: translateX(60px);
}
</style>
    <button class="search-btn">Search</button>
</div>

</body>
</html>
